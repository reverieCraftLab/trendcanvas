spring:
  application:
    name: trendcanvas
  datasource:
    # Supabase 접속 정보는 실제 값을 코드에 넣지 않고 환경변수로 주입한다.
    # (로컬에서 돌릴 때는 이 값들을 export하거나 .env를 쓰고, EC2에서는 시스템 환경변수로 준다)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false # 뷰 렌더링까지 트랜잭션/세션을 열어두지 않는다. 조회는 서비스 계층에서 fetch join으로 필요한 데이터를 미리 다 가져오고 끝낸다.
    hibernate:
      ddl-auto: validate # 테이블은 오직 Flyway 마이그레이션으로만 만든다. Hibernate가 스키마를 자동 생성/변경하게 두지 않고, 엔티티와 실제 스키마가 어긋나면 검증 단계에서 바로 에러로 잡아낸다.
  flyway:
    enabled: true
